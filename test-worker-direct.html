<!DOCTYPE html>
<html>
<head>
    <title>Direct Worker Test - Module.scad Fix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { margin: 10px 0; padding: 10px; background-color: #f8f9fa; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        pre { background-color: #f4f4f4; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Direct Worker Test - Module.scad Include Fix</h1>
    <p>This test directly tests the OpenSCAD worker to verify it can handle module.scad includes.</p>
    
    <button onclick="runWorkerTest()">Run Worker Test</button>
    <button onclick="clearLogs()">Clear Logs</button>
    
    <div id="logs"></div>
    
    <script>
        let worker = null;
        
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = 'log';
            div.innerHTML = `<span class="${type}">[${new Date().toLocaleTimeString()}] ${message}</span>`;
            logs.appendChild(div);
            console.log(`[WORKER TEST] ${message}`);
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
        
        function runWorkerTest() {
            clearLogs();
            log('Starting direct worker test...');
            
            if (worker) {
                worker.terminate();
            }
            
            // Create worker
            log('Creating OpenSCAD worker...');
            worker = new Worker('./src/openscadWorker.js', { type: 'module' });
            
            // Test code that requires module.scad
            const testCode = `include <module.scad>

// Test basic module - rounded cube
rounded_cube([20, 15, 10], 2, facets=16);

// Test another module - tube
translate([30, 0, 0]) {
    tube(outer_radius=8, inner_radius=6, height=15, center=true);
}`;
            
            log('Test code prepared:');
            log(`<pre>${testCode}</pre>`, 'info');
            
            // Set up worker message handler
            worker.onmessage = (e) => {
                const { id, result, error } = e.data;
                
                if (error) {
                    log(`Worker error: ${error}`, 'error');
                    log('❌ Test FAILED - Worker reported error', 'error');
                    
                    // Check if it's a module-related error
                    if (error.includes('module') || error.includes('include')) {
                        log('💡 This appears to be related to the module.scad include issue', 'error');
                    }
                } else if (result) {
                    log(`Worker success! Received STL data: ${result.byteLength} bytes`, 'success');
                    
                    // Verify it's a valid STL file
                    const view = new Uint8Array(result);
                    const header = String.fromCharCode.apply(null, view.slice(0, 5));
                    
                    if (header === 'solid') {
                        log('✅ STL header verified - valid STL file generated', 'success');
                        log('🎉 Test PASSED! Worker successfully handled module.scad include', 'success');
                    } else {
                        log('⚠️ STL header check inconclusive, but data received', 'info');
                        log('✅ Test likely PASSED - STL data generated', 'success');
                    }
                    
                    // Show first few bytes as hex for verification
                    const firstBytes = Array.from(view.slice(0, 20)).map(b => b.toString(16).padStart(2, '0')).join(' ');
                    log(`First 20 bytes (hex): ${firstBytes}`, 'info');
                }
                
                worker.terminate();
                worker = null;
            };
            
            worker.onerror = (error) => {
                log(`Worker error: ${error.message}`, 'error');
                log('❌ Test FAILED - Worker error', 'error');
                worker.terminate();
                worker = null;
            };
            
            // Send test request
            const requestId = 'test-' + Date.now();
            log(`Sending test request (${requestId})...`);
            
            worker.postMessage({
                id: requestId,
                command: 'render',
                data: { openscadCode: testCode }
            });
            
            log('Request sent. Waiting for worker response...');
        }
        
        // Auto-run test on page load
        window.addEventListener('load', () => {
            log('Page loaded. Click "Run Worker Test" to test the module.scad fix.');
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (worker) {
                worker.terminate();
            }
        });
    </script>
</body>
</html>
