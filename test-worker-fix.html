<!DOCTYPE html>
<html>
<head>
    <title>Test Worker Module.scad Fix</title>
</head>
<body>
    <h1>Testing OpenSCAD Worker with module.scad</h1>
    <div id="status">Initializing...</div>
    <div id="result"></div>

    <script type="module">
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');

        function updateStatus(message, type = 'info') {
            statusEl.innerHTML += `<div style="color: ${type === 'error' ? 'red' : type === 'success' ? 'green' : 'black'}">${message}</div>`;
            console.log(`[TEST] ${message}`);
        }

        async function testWorker() {
            try {
                updateStatus('Creating worker...');
                const worker = new Worker('./src/openscadWorker.js', { type: 'module' });

                // Test code that uses module.scad
                const testCode = `include <module.scad>

// Test rounded cube using module
rounded_cube([20, 15, 10], 2, facets=16);

// Test tube module
translate([30, 0, 0]) {
    tube(outer_radius=8, inner_radius=6, height=15, center=true);
}`;

                updateStatus('Testing code with module.scad include...');
                
                const testRequest = {
                    id: 'test-' + Date.now(),
                    command: 'render',
                    data: { openscadCode: testCode }
                };

                worker.onmessage = (e) => {
                    const { id, result, error } = e.data;
                    
                    if (error) {
                        updateStatus(`Worker error: ${error}`, 'error');
                        resultEl.innerHTML = `<div style="color: red;">Test FAILED: ${error}</div>`;
                    } else if (result) {
                        updateStatus(`Worker success! STL size: ${result.byteLength} bytes`, 'success');
                        resultEl.innerHTML = `<div style="color: green;">Test PASSED! Generated STL with ${result.byteLength} bytes</div>`;
                        
                        // Verify it's a valid STL file (check header)
                        const view = new Uint8Array(result);
                        const header = String.fromCharCode.apply(null, view.slice(0, 5));
                        if (header === 'solid') {
                            updateStatus('STL header verified - appears to be valid STL file', 'success');
                        } else {
                            updateStatus('STL header check inconclusive', 'info');
                        }
                    }
                    
                    worker.terminate();
                };

                worker.onerror = (error) => {
                    updateStatus(`Worker error: ${error.message}`, 'error');
                    resultEl.innerHTML = `<div style="color: red;">Test FAILED: ${error.message}</div>`;
                };

                worker.postMessage(testRequest);

            } catch (error) {
                updateStatus(`Test error: ${error.message}`, 'error');
                resultEl.innerHTML = `<div style="color: red;">Test FAILED: ${error.message}</div>`;
            }
        }

        // Run test when page loads
        window.addEventListener('load', testWorker);
    </script>
</body>
</html>
