<!DOCTYPE html>
<html>
<head>
    <title>Verify Module.scad Fix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        pre { background-color: #f4f4f4; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>🔧 Verify Module.scad Include Fix</h1>
    <p>This page verifies that the OpenSCAD worker can now properly handle module.scad includes.</p>
    
    <button onclick="runVerification()">Run Verification Test</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results"></div>
    
    <script type="module">
        const resultsDiv = document.getElementById('results');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            resultsDiv.appendChild(div);
            console.log(`[VERIFICATION] ${message}`);
        }
        
        function clearResults() {
            resultsDiv.innerHTML = '';
        }
        
        window.runVerification = async function() {
            clearResults();
            log('🚀 Starting module.scad fix verification...', 'info');
            
            try {
                // Test 1: Check if module.scad file is accessible
                log('📋 Test 1: Checking if module.scad file is accessible...', 'info');
                const moduleResponse = await fetch('./src/modules/module.scad');
                if (moduleResponse.ok) {
                    const moduleContent = await moduleResponse.text();
                    log(`✅ module.scad found! Size: ${moduleContent.length} characters`, 'success');
                    
                    // Check for key modules
                    const keyModules = ['rounded_cube', 'tube', 'gear', 'honeycomb'];
                    const foundModules = keyModules.filter(mod => moduleContent.includes(`module ${mod}`));
                    log(`✅ Found modules: ${foundModules.join(', ')}`, 'success');
                } else {
                    throw new Error(`Cannot access module.scad: ${moduleResponse.status}`);
                }
                
                // Test 2: Generate code that uses modules
                log('📋 Test 2: Generating code with modules...', 'info');
                const response = await fetch('/generate-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: 'create a rounded cube with a tube through it',
                        existingCode: ''
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Generation failed: ${response.status}`);
                }
                
                const result = await response.json();
                log(`✅ Generation request sent: ${result.requestId}`, 'success');
                
                // Wait for processing
                log('⏳ Waiting for processing...', 'info');
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // Check status
                const statusResponse = await fetch(`/status/${result.requestId}`);
                const statusData = await statusResponse.json();
                
                if (statusData.data.status === 'complete' && statusData.data.code) {
                    const code = statusData.data.code;
                    log('✅ Code generation completed!', 'success');
                    
                    // Check for module.scad include
                    if (code.includes('include <module.scad>')) {
                        log('✅ Code includes module.scad', 'success');
                        
                        // Check for module usage
                        const modules = ['rounded_cube', 'tube', 'gear', 'honeycomb'];
                        const usedModules = modules.filter(mod => code.includes(mod));
                        
                        if (usedModules.length > 0) {
                            log(`✅ Code uses modules: ${usedModules.join(', ')}`, 'success');
                        }
                        
                        log('📋 Generated code:', 'info');
                        log(`<pre>${code}</pre>`, 'info');
                    } else {
                        log('ℹ️  Code does not include module.scad (using basic primitives)', 'info');
                    }
                } else {
                    log(`⚠️  Status: ${statusData.data.status} - ${statusData.data.message}`, 'info');
                }
                
                // Test 3: Test worker directly (if possible)
                log('📋 Test 3: Testing worker directly...', 'info');
                
                const workerTestCode = `include <module.scad>
rounded_cube([10, 10, 10], 1, facets=8);`;
                
                // Create a simple test worker
                const workerBlob = new Blob([`
                    import OpenSCAD from "./openscad.js";
                    
                    let moduleContent = null;
                    
                    async function getModuleContent() {
                        if (!moduleContent) {
                            const response = await fetch("./src/modules/module.scad");
                            moduleContent = await response.text();
                        }
                        return moduleContent;
                    }
                    
                    self.onmessage = async (e) => {
                        try {
                            const instance = await OpenSCAD();
                            
                            if (e.data.code.includes("include <module.scad>")) {
                                const moduleData = await getModuleContent();
                                instance.FS.writeFile("/module.scad", moduleData);
                            }
                            
                            instance.FS.writeFile("/model.scad", e.data.code);
                            instance.callMain(["/model.scad", "-o", "model.stl", "--render"]);
                            
                            const stlData = instance.FS.readFile("/model.stl");
                            self.postMessage({ success: true, size: stlData.byteLength });
                            
                        } catch (error) {
                            self.postMessage({ success: false, error: error.message });
                        }
                    };
                `], { type: 'application/javascript' });
                
                const testWorker = new Worker(URL.createObjectURL(workerBlob), { type: 'module' });
                
                testWorker.onmessage = (e) => {
                    if (e.data.success) {
                        log(`✅ Worker test PASSED! Generated ${e.data.size} byte STL`, 'success');
                        log('🎉 VERIFICATION COMPLETE - The fix is working!', 'success');
                    } else {
                        log(`❌ Worker test failed: ${e.data.error}`, 'error');
                    }
                    testWorker.terminate();
                };
                
                testWorker.onerror = (error) => {
                    log(`⚠️  Worker test error: ${error.message}`, 'error');
                    testWorker.terminate();
                };
                
                testWorker.postMessage({ code: workerTestCode });
                
            } catch (error) {
                log(`❌ Verification failed: ${error.message}`, 'error');
                console.error('Verification error:', error);
            }
        };
        
        // Auto-run on page load
        window.addEventListener('load', () => {
            log('Page loaded. Click "Run Verification Test" to test the fix.', 'info');
        });
    </script>
</body>
</html>
