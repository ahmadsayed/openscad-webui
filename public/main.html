<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptSCAD: Free Online OpenSCAD Editor with AI Assistance</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Edit OpenSCAD code online with AI-powered suggestions. Create parametric 3D models for printing with natural language prompts.">
    <meta name="keywords" content="OpenSCAD editor, AI CAD tools, online 3D modeling, CAD automation, AI code assistant, parametric modeling, 3D printing">
    <meta name="author" content="PromptSCAD">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://promptscad.com/main.html">
    
    <!-- Open Graph / Facebook Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://promptscad.com/main.html">
    <meta property="og:title" content="PromptSCAD: Free Online OpenSCAD Editor with AI Assistance">
    <meta property="og:description" content="Edit OpenSCAD code online with AI-powered suggestions. Create parametric 3D models for printing with natural language prompts.">
    <meta property="og:image" content="https://promptscad.com/main/sample.png">
    
    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://promptscad.com/main.html">
    <meta name="twitter:title" content="PromptSCAD: Free Online OpenSCAD Editor with AI Assistance">
    <meta name="twitter:description" content="Edit OpenSCAD code online with AI-powered suggestions. Create parametric 3D models for printing with natural language prompts.">
    <meta name="twitter:image" content="https://promptscad.com/main/sample.png">
    
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <!-- Styling -->
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- 3D and Editor Libraries -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylon.stlFileLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.28.0/src-min-noconflict/ace.min.js"></script>

    <script>
        window.ezstandalone = window.ezstandalone || {};
        ezstandalone.cmd = ezstandalone.cmd || [];
    </script>
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PromptSCAD Editor",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Edit OpenSCAD code online with AI-powered suggestions. Create parametric 3D models for printing with natural language prompts.",
      "featureList": "AI-assisted code editing, 3D model preview, STL export, SCAD file management",
      "browserRequirements": "Requires a modern browser with WebGL support"
    }
    </script>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <a href="/" style="text-decoration: none; color: inherit;">
            <div class="logo">
                <h1>PromptSCAD</h1>
            </div>
        </a>
        <ul class="nav-list">
            <li class="nav-item">
                <a href="#">File</a>
                <div class="dropdown">
                    <a href="#" onclick="newDesign(event)">
                        <i class="bi bi-plus"></i> New
                    </a>
                    <input type="file" id="fileInput" style="display:none;">
                    <a href="#" onclick="openDesign(event)">
                        <i class="bi bi-folder"></i> Open
                        <span class="shortcut">Ctrl + O</span>
                    </a>
                    <a href="#" onclick="saveDesign(event)">
                        <i class="bi bi-save"></i> Save
                        <span class="shortcut">Ctrl + S</span>
                    </a>
                </div>
            </li>
            <li class="nav-item">
                <a href="#">Design</a>
                <div class="dropdown">
                    <a href="#" onclick="downloadSTL(event)">
                        <i class="bi bi-download"></i> Download STL
                    </a>
                    <a href="#" onclick="downloadSCAD(event)">
                        <i class="bi bi-download"></i> Download SCAD
                    </a>
                </div>
            </li>
        </ul>
        <div class="flex-spacer"></div>
    </nav>

    <!-- Main Container -->
    <div class="container split">
        <!-- Left Panel - Code Editor and Chat -->
        <div class="split__left">
            <!-- SCAD Code Editor -->
            <div id="editor">cube(20, center=true);</div>

            <!-- Vertical Resize Bar -->
            <div class="resize-bar-vertical"></div>

            <!-- Chat Interface -->
            <div class="chat-container">
                <div class="editor-container">
                    <div id="chatEditor"></div>
                    <div class="placeholder-text">Ask AI to modify the SCAD model, e.g., 'Make a cube with rounded edges'</div>
                </div>
                <div class="chat-controls">
                    <button id="chatSubmit" class="chat-submit">
                        <i class="bi bi-send"></i> <span class="button-text">Send</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Horizontal Resize Bar -->
        <div class="split__bar"></div>

        <!-- Right Panel - 3D Render -->
        <div class="split__right">
            <div id="loadingScreen"></div>
            <canvas id="renderCanvas"></canvas>
        </div>
    </div>

    <!-- App Scripts -->
    <script src="./openscad.js" type="module"></script>
    <script src="./openscad.fonts.js" type="module"></script>
    <script src="./openscad.mcad.js" type="module"></script>
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/openscadWorker.js"></script>

    
    <!-- Ad script -->
    <script>
        ezstandalone.cmd.push(function () {
            ezstandalone.showAds(101);
        });
    </script>
</body>

</html>
